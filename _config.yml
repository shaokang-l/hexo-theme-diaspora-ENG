# 默认音乐（随机播放）
mp3: 
    - http://music.163.com/song/media/outer/url?id=430224.mp3
    
language: 
  - en-us
# 首页封面图, 为空时取文章的cover作为封面(注意跨域问题,建议使用同源图片)
welcome_cover: /img/cover-spring.jpg

# 默认文章封面图（随机调用,支持外链）
cover:
  - /img/cover-spring.jpg

# 首页文章列表是否显示封面缩略图 (关闭时为时间线式文字卡片) / show cover thumbnails in the home post list
