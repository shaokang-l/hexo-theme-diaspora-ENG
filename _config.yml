    # LeanCloud 应用的 AppID / AppKey (公开可见, 属正常) / LeanCloud AppID / AppKey (public by design)
    appId: 'V5TlA1sBo6I0jj0UAHU5cK04-gzGzoHsz'
    appKey: 'KxU4ydJ3GkVkqk6ThXVXi8RF'
    # 评论框占位文字 / placeholder text
    placeholder: '到此一游'
    # 头像风格 / avatar style: mp, identicon, monsterid, wavatar, retro, robohash, hide
    avatar: robohash
    # 提交时需要验证码 / captcha on submit
    verify: true

# 网站关键字
keywords: Fechin

# 要使用google_analytics进行统计的话，这里需要配置ID
google_analytics: 

# 网站ico
favicon: /img/favicon.png

# rss文件
rss: atom.xml

# NPR 三维场景 (three.js)：首页封面换成手绘风格的森林与金色鹿角的鹿，菜单换成一个可点击物件的小房间
# NPR 3D scenes: the home cover becomes an illustrated forest with a golden stag, the menu a clickable room.
# 调试 / debug: ?npr=0 (关闭 / off), ?npr=low (低画质 / low quality)
npr:
  enable: true
  # 夜间模式 (每页右上角的太阳/月亮按钮, 访客的选择会被记住) 的默认值: auto 跟随系统深色设置, day 白天, night 夜间
  # night mode default (the sun/moon toggle on every page remembers each visitor's choice):
  # auto = follow the OS dark setting, day, night. Links can force it with ?night=1 / ?night=0
  night_default: auto
  # 首页 3D 封面 / 3D hero on the home page (the painting above stays as fallback)
  hero: true
  # 菜单房间 / menu as a 3D room (the text menu stays as fallback)
  menu_room: true
  # 触屏 / 小屏 / 低端设备上也运行 (低画质) / also run on touch, narrow or low-end devices (low quality)
  mobile: true
  # 3D 封面开启时左侧多边形的颜色 (替代从封面图取色) / #vibrant polygon colour over the 3D hero
  overlay_color: "#102a33"
  # 搜索、菜单图标颜色, 同时传给场景 / search + menu icon colour over the hero, also passed to the scenes
  accent_color: "#f5c46a"
  # 菜单名 -> 房间物件 (bookshelf, tags, cabinet, portrait, gramophone, sofa, desk, corkboard, easel)
  # menu name -> room object; unlisted names become a wooden crate
  room_objects:
    Category: bookshelf
    Archives: cabinet
    About: portrait
    Selection: gramophone
    Friends: sofa
    Log: desk
    Bulletin: corkboard
    Portfolio: easel
  # 子页面的 3D 插图 (页面路径 -> 场景) / three.js vignettes on sub-pages (page path -> scene, js/npr/page-<scene>.js)
  pages:
    /about/: about
    /categories/: categories
    /friends/: friends
    /recommend/: selection
